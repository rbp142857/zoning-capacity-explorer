# Inglewood R-2A. Every value cites the Inglewood Municipal Code, Chapter 12 (eCode360, read 2026-11-01).
zone: "R-2A"
name: "R-2A Limited Multiple-Family Zone"
family: multifamily

sources:
  Z:
    section: "IMC Ch. 12, Article 3.1 (R-2A Limited Multiple-Family Zone)"
    url: https://ecode360.com/43786367
  P:
    section: "IMC Ch. 12, Article 19 (Parking Regulations)"
    url: https://ecode360.com/43787806

residential_allowed: {value: true, source: Z}
housing_types: {value: [multifamily], source: Z}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {below: 5000, value: 1}
      - {below: 9000, value: 2}
      - {below: 13000, value: 3}
      - {below: 17000, value: 4}
      - {below: 21000, value: 5}
      - {below: 25000, value: 6}
      - {below: 29000, value: 7}
      - {below: 33000, value: 8}
      - {below: 37000, value: 9}
      - {below: 41000, value: 10}
      - {below: 45000, value: 11}
      - {below: 49000, value: 12}
      - {below: 53000, value: 13}
      - {below: 57000, value: 14}
      - {below: 61000, value: 15}
      - {value: 16}
  source: Z
  assumption: "§ Lot Area Per Unit: 2,500 sq ft each for 1 or 2 homes, 9,000 for 3, and 4,000 more per extra home. A lot under 2,500 sq ft keeps one home (assumed)."
small_lot_units_below_sqft: 65000
lot_area_per_unit_sqft: {value: 4000, source: Z, assumption: "Lots over 65,000 sq ft use a flat 4,000 per home, slightly low."}

setbacks:
  front_ft: {value: 20, source: Z}
  side_ft: {value: {pct_of_width: 0.1, min_ft: 3, max_ft: 5}, source: Z, assumption: "Same as R-1: 10% of lot width, at least 3 ft, at most 5 ft."}
  rear_ft: {value: 25, source: Z, assumption: "Same as R-1: 25% of lot depth, at most 25 ft; we use 25 ft."}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 2.5, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "Two enclosed spaces per home (§ 12-Article 19, Residential Parking Requirements). None within ½ mile of a major transit stop (the AB 2097 path)."}

simplifications:
  - "Objective Design Standards and any lot coverage limit outside the sections cited are not modeled."
