# Inglewood R-1. Every value cites the Inglewood Municipal Code, Chapter 12 (eCode360, read 2026-11-01).
zone: "R-1"
name: "R-1 One-Family Zone"
family: single_family

sources:
  Z:
    section: "IMC Ch. 12, Article 2 (R-1 One-Family Zone)"
    url: https://ecode360.com/43786276
  P:
    section: "IMC Ch. 12, Article 19 (Parking Regulations)"
    url: https://ecode360.com/43787806

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family], source: Z}
min_lot_area_sqft: {value: 6000, source: Z}
max_units_per_lot: {value: 1, source: Z, assumption: "One home per lot, including smaller lots of record. State law (ADU, SB 9) is modeled separately."}

setbacks:
  front_ft: {value: 25, source: Z}
  side_ft: {value: {pct_of_width: 0.1, min_ft: 3, max_ft: 5}, source: Z, assumption: "10% of lot width, at least 3 ft, at most 5 ft."}
  rear_ft: {value: 25, source: Z, assumption: "25% of lot depth, at most 25 ft; we use 25 ft."}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 2.5, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "Two enclosed spaces per home (§ 12-Article 19, Residential Parking Requirements). None within ½ mile of a major transit stop (the AB 2097 path)."}

simplifications:
  - "Front yard is 25% of depth, at most 25 ft; we use 25 ft. Prevailing front yards are not modeled."
  - "Objective Design Standards and any lot coverage limit outside the sections cited are not modeled."
