# Norwalk R-1. Every value cites the Norwalk Municipal Code, Title 17 (eCode360, including Ord. 25-1762, read 2026-11-01).
zone: "R-1"
name: "Single-Family Residential (R-1)"
family: single_family

sources:
  Z:
    section: "NMC Ch. 17.05, Art. I (§§17.05.020 to .070)"
    url: https://ecode360.com/43504227
  P:
    section: "NMC §17.03.040 (parking matrix)"
    url: https://ecode360.com/43503014

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family], source: Z}
min_lot_area_sqft: {value: 5000, source: Z}
min_lot_width_ft: {value: 50, source: Z}
max_units_per_lot: {value: 1, source: Z, assumption: "A one-family zone. ADUs and SB 9 are state law, modeled separately."}

setbacks:
  front_ft: {value: 20, source: Z, assumption: "20% of depth, at most 20 ft; we use 20 ft."}
  side_ft: {value: 5, source: Z, assumption: "5 ft on the first story, 10 ft on the second; we use the first."}
  rear_ft: {value: 20, source: Z, assumption: "20% of depth, with a cap; we use 20 ft."}

max_height_ft: {value: 30, source: Z}
max_stories: {value: 2, source: Z}
lot_coverage: {value: 0.40, source: Z}
max_far: {value: 0.40, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "2 per home. None within ½ mile of a major transit stop (the AB 2097 path)."}

simplifications:
  - "Second-story setbacks and top plate limits are not modeled."
