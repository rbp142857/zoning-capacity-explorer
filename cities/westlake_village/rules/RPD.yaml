# Westlake Village RPD. Every value cites the Westlake Village Municipal Code, Article 9 (Municode, read 2026-11-01).
zone: "RPD"
name: "Residential Planned Development (RPD)"
family: multifamily

sources:
  Z:
    section: "WVMC Ch. 9.6 (RPD Zone)"
    url: https://library.municode.com/ca/westlake_village/codes/code_of_ordinances?nodeId=ART9ZORE_CH9.6RPREPLDEZO
  S:
    section: "WVMC §9.14.020 (Development Standards)"
    url: https://library.municode.com/ca/westlake_village/codes/code_of_ordinances?nodeId=ART9ZORE_CH9.14DEST
  P:
    section: "WVMC Ch. 9.19 (Number of Parking Spaces Required)"
    url: https://library.municode.com/ca/westlake_village/codes/code_of_ordinances?nodeId=ART9ZORE_CH9.19OREPALOST

residential_allowed: {value: true, source: Z, assumption: "Single-family and multifamily homes, each with a planned development permit."}
housing_types: {value: [single_family, multifamily], source: Z}
max_units_per_lot: {value: 1, source: Z, assumption: "§9.6.080 sets the homes on a site by its General Plan land use designation. We have no parcel map of those designations, so we count one home per lot and no new homes on existing multifamily sites (conservative)."}

setbacks:
  front_ft: {value: 20, source: S}
  side_ft: {value: {pct_of_width: 0.1, min_ft: 0, max_ft: 10}, source: S, assumption: "Same as R-1 for single-family homes, unless conditions of approval change it. 10% of average lot width, to a maximum of 10 ft."}
  rear_ft: {value: 25, source: S}

max_height_ft: {value: 35, source: S}
max_stories: {value: 2, source: S}
parking_per_unit: {value: 2, source: P, assumption: "2 covered spaces per home. None within ½ mile of a major transit stop (the AB 2097 path)."}

simplifications:
  - "Lot width and area minimums are not applied: RPD lots were set by each development's approval."
  - "§9.14.090 lets SB 9 apply in RPD-4, RPD-56, RPD-126, RPD-153, RPD-169, RPD-284 and RPD-481 only. SCAG drops the number, so we model SB 9 in no RPD lot (conservative); those lots run low."
