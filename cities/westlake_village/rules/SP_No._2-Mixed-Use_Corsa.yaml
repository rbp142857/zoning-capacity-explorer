# Westlake Village SP No. 2-Mixed-Use Corsa. The city's summary of the North Business Park Specific Plan; the plan's PDF could not be opened, so its Table 4-1 was not read.
zone: "SP No. 2-Mixed-Use Corsa"
name: "North Business Park: Mixed-Use Corsa"
family: multifamily

sources:
  Z:
    section: "City of Westlake Village, North Business Park: Mixed-Use Corsa district page (read 2026-11-01)"
    url: https://wlv.org/560/Mixed-Use-Corsa-District
  S:
    section: "WVMC §9.14.020 (Development Standards)"
    url: https://library.municode.com/ca/westlake_village/codes/code_of_ordinances?nodeId=ART9ZORE_CH9.14DEST
  P:
    section: "WVMC Ch. 9.19 (Number of Parking Spaces Required)"
    url: https://library.municode.com/ca/westlake_village/codes/code_of_ordinances?nodeId=ART9ZORE_CH9.19OREPALOST

residential_allowed: {value: true, source: Z, assumption: "The district allows residential or mixed-use development; we count an all-residential building."}
housing_types: {value: [multifamily, mixed_use], source: Z}
lot_area_per_unit_sqft: {value: 2178.0, source: Z, assumption: "20 homes per acre on each parcel: 43,560 divided by 20."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 2178.0

setbacks:
  front_ft: {value: 10, source: Z, assumption: "10 ft from property line."}
  side_ft: {value: 0, source: Z, assumption: "Not given on the district page; not modeled."}
  rear_ft: {value: 0, source: Z, assumption: "Not given on the district page; not modeled."}

max_height_ft: {value: 55, source: Z}
max_stories: {value: 3, source: Z}
lot_coverage: {value: 0.40, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "Not given on the district page, so the general rule of 2 covered spaces per home; the plan may differ. None within ½ mile of a major transit stop (the AB 2097 path)."}

simplifications:
  - "The whole district is capped at 145 homes. We count each parcel on its own and don't apply the cap, so the district total can run high (about 320 before other limits)."
  - "Density bonuses are not modeled. Open space, massing and the plan's full standards are not modeled."
