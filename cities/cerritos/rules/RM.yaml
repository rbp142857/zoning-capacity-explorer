# Cerritos RM. Every value cites the Cerritos Municipal Code, Title 22 (eCode360, read 2026-11-02).
zone: "RM"
name: "RM Multi-Family Residential"
family: multifamily

sources:
  Z:
    section: "CMC §§22.23.300, 22.23.600 and 22.23.700"
    url: https://ecode360.com/50811867
  P:
    section: "CMC Ch. 22.74"
    url: https://ecode360.com/50815967

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family, multifamily], source: Z}
min_lot_area_sqft: {value: 6500, source: Z, assumption: "For single-family use; multi-family lots need 3 acres."}
lot_area_per_unit_sqft: {value: 2178, source: Z, assumption: "No more than 20 homes per acre: 43,560 divided by 20. The approving authority sets the exact density, so sites can get less."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "Multi-family use needs a 3-acre lot (§22.23.700(2)), so smaller lots count one single-family home."
small_lot_units_below_sqft: 130680

setbacks:
  front_ft: {value: 25, source: Z}
  side_ft: {value: 24, source: Z, assumption: "24 ft next to uses other than multi-family, and 25 ft on a street; less next to multi-family. We use 24 (conservative)."}
  rear_ft: {value: 24, source: Z, assumption: "As for side yards."}

max_stories: {value: 2, source: Z, assumption: "We didn't capture this zone's height limit, so we fit 2 (assumed)."}
lot_coverage: {value: 0.40, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces per home on the building site (§22.74). None within ½ mile of a major transit stop (the AB 2097 path)."}

simplifications:
  - "Recreation open space of 200 sq ft and private open space of at least 75 sq ft per home are not modeled, so large lots can run high."
