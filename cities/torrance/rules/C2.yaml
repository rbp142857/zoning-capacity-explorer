# Torrance C2. Every value cites the Torrance Municipal Code, Division 9 (Code Publishing, read 2026-11-02; current through Ord. 3969, June 23, 2026).
zone: "C2"
name: "General Commercial (C-2)"
family: commercial

sources:
  Z:
    section: "TMC Art. 21, incl. §91.21.8"
    url: https://www.codepublishing.com/CA/Torrance/html/Torrance09/Torrance0901.html#91.21
  P:
    section: "TMC §93.2.3 (multiple-family parking)"
    url: https://www.codepublishing.com/CA/Torrance/html/Torrance09/Torrance0903.html#93.2.3

residential_allowed: {value: true, source: Z, assumption: "Homes need a conditional use permit."}
housing_types: {value: [multifamily], source: Z}
approval: {value: conditional, source: Z, assumption: "Homes need a conditional use permit."}
lot_area_per_unit_sqft: {value: 1600, source: Z, assumption: "The article says both R-4's area (1,000 sq ft) and 1,600 sq ft per home. We use 1,600 (conservative); see the open decision."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 1600

setbacks:
  front_ft: {value: 20, source: Z, assumption: "R-3's front yard, for homes."}
  side_ft: {value: {pct_of_width: 0.10, min_ft: 3, max_ft: 5}, source: Z, assumption: "§91.8.8's side yards, for homes."}
  rear_ft: {value: 10, source: Z, assumption: "R-3's rear yard, for homes."}

max_height_ft: {value: 50, source: Z}
max_stories: {value: 4, source: Z, assumption: "The code limits homes to 50 ft, not stories; we fit 4 (assumed)."}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces for 2 bedrooms or fewer; 3 bedrooms or more need 3. We use 2. None within ½ mile of a major transit stop (the AB 2097 path), and none under the Housing Corridor Overlay, which is not in our data."}

simplifications:
  - "R-3's usable open space applies and isn't modeled, so these can run high."
