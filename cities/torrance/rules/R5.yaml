# Torrance R5. Every value cites the Torrance Municipal Code, Division 9 (Code Publishing, read 2026-11-02; current through Ord. 3969, June 23, 2026).
zone: "R5"
name: "High Rise Residential (R-5)"
family: multifamily

sources:
  Z:
    section: "TMC §§91.11.1 to 91.11.14"
    url: https://www.codepublishing.com/CA/Torrance/html/Torrance09/Torrance0901.html#91.11
  P:
    section: "TMC §93.2.3 (multiple-family parking)"
    url: https://www.codepublishing.com/CA/Torrance/html/Torrance09/Torrance0903.html#93.2.3

residential_allowed: {value: true, source: Z}
housing_types: {value: [multifamily], source: Z}
approval: {value: by_right, source: Z, assumption: "§91.11.1 lists multiple family dwellings as a permissible use."}
min_lot_area_sqft: {value: 43560, source: Z}
min_lot_width_ft: {value: 200, source: Z}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "Under 1 acre, one home with a conditional use permit (§91.11.9)."
small_lot_units_below_sqft: 43560

setbacks:
  front_ft: {value: 30, source: Z, assumption: "The front is set by a height plane from the street centerline (§91.11.8); we use the 30 ft side and rear yard (assumed)."}
  side_ft: {value: 30, source: Z}
  rear_ft: {value: 30, source: Z}

max_stories: {value: 6, source: Z, assumption: "Height follows the Building Code, and the table runs to 24 stories. We use 6 (assumed, conservative); taller buildings get more floor area."}
max_far: {value: 0.78, source: Z, assumption: "The §91.11.11 ratio for 6 stories."}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces for 2 bedrooms or fewer; 3 bedrooms or more need 3. We use 2. None within ½ mile of a major transit stop (the AB 2097 path), and none under the Housing Corridor Overlay, which is not in our data."}

simplifications:
  - "The open space ratio (0.87 per sq ft of floor area at 6 stories) is not modeled."
