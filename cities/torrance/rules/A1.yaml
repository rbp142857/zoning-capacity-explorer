sb9_allowed: {value: false, source: Z, assumption: "SB 9 covers single-family residential zones. This is an agricultural district, so we don't apply it (conservative), as with LA's A1 and A2; see the open decision."}

setbacks:
  front_ft: {value: 20, source: Z, assumption: "R-1's yards, per §91.15.4."}
  side_ft: {value: {pct_of_width: 0.10, min_ft: 3, max_ft: 100}, source: Z, assumption: "R-1's yards, per §91.15.4."}
  rear_ft: {value: 20, source: Z, assumption: "R-1's yards, per §91.15.4."}

max_height_ft: {value: 27, source: Z}
max_stories: {value: 2, source: Z, assumption: "The code limits height to 27 ft; we fit 2."}
