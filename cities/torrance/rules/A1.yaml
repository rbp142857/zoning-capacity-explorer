# Torrance A1. Every value cites the Torrance Municipal Code, Division 9 (Code Publishing, read 2026-11-02; current through Ord. 3969, June 23, 2026).
zone: "A1"
name: "Light Agricultural (A-1)"
family: single_family

sources:
  Z:
    section: "TMC §§91.15.1 to 91.15.4"
    url: https://www.codepublishing.com/CA/Torrance/html/Torrance09/Torrance0901.html#91.15

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family], source: Z}
min_lot_area_sqft: {value: 6000, source: Z}
