# Torrance R3. Every value cites the Torrance Municipal Code, Division 9 (Code Publishing, read 2026-11-02; current through Ord. 3969, June 23, 2026).
zone: "R3"
name: "Limited Multiple Family Residential (R-3)"
family: multifamily

sources:
  Z:
    section: "TMC §§91.7.1 to 91.7.11"
    url: https://www.codepublishing.com/CA/Torrance/html/Torrance09/Torrance0901.html#91.7
  P:
    section: "TMC §93.2.3 (multiple-family parking)"
    url: https://www.codepublishing.com/CA/Torrance/html/Torrance09/Torrance0903.html#93.2.3

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family, two_unit, multifamily], source: Z}
approval: {value: by_right, source: Z, assumption: "The zone's permissible uses list apartment houses and flat buildings."}
min_lot_area_sqft: {value: 6000, source: Z}
min_lot_width_ft: {value: 50, source: Z}
lot_area_per_unit_sqft: {value: 1600, source: Z}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 1600

setbacks:
  front_ft: {value: 20, source: Z}
  side_ft: {value: {pct_of_width: 0.10, min_ft: 3, max_ft: 5}, source: Z}
  rear_ft: {value: 10, source: Z}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 2, source: Z, assumption: "Over 2 stories needs a conditional use permit; we use 2 (conservative)."}
max_floor_area:
  value:
    by: lot_area_sqft
    bands:
      - {below: 4800, share: 0.6}
      - {below: 12800, share: 1.0}
      - {below: 17600, share: 1.25}
      - {share: 0.6}
  source: Z
  assumption: "§91.7.9: 0.6 of the lot without garages. Developments of 3 to 7 homes get 1.0 and of 8 to 10 homes get 1.25, both counting garages. We pick by the homes the lot's area allows (1,600 sq ft each). Garages aren't subtracted, but lot area binds on these lots either way."
parking_per_unit: {value: 2, source: P, assumption: "2 spaces for 2 bedrooms or fewer; 3 bedrooms or more need 3. We use 2. None within ½ mile of a major transit stop (the AB 2097 path), and none under the Housing Corridor Overlay, which is not in our data."}

simplifications:
  - "Usable open space of 0.5 sq ft per sq ft of home, up to 600 sq ft per home, is not modeled, so these can run high."
