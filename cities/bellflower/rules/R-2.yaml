# Bellflower R-2. Every value cites the Bellflower Municipal Code, Title 17 (eCode360, through Ord. 1461 of September 28, 2026, read 2026-11-02).
zone: "R-2"
name: "R-2 Medium Density Residential"
family: multifamily

sources:
  Z:
    section: "BMC §§17.28.020 and 17.28.050 to 17.28.130"
    url: https://ecode360.com/43108215

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family, two_unit, multifamily], source: Z}
approval: {value: by_right, source: Z, assumption: "Multiple family residential uses are permitted uses, subject to the chapter's standards."}
min_lot_area_sqft: {value: 6000, source: Z}
lot_area_per_unit_sqft: {value: 3350, source: Z}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot of record too small for one home keeps one (§17.28.060)."
small_lot_units_below_sqft: 3350

setbacks:
  front_ft: {value: 20, source: Z, assumption: "20 ft for two stories; 15 ft for one."}
  side_ft: {value: 8, source: Z, assumption: "8 ft for living and bedroom walls; 5 ft for secondary walls. We use 8 (conservative)."}
  rear_ft: {value: 8, source: Z, assumption: "8 ft next to living areas and bedrooms; 5 ft for secondary walls. We use 8 (conservative)."}

max_height_ft: {value: 30, source: Z}
max_stories: {value: 2, source: Z}
parking_per_unit: {value: 2, source: Z, assumption: "2 enclosed spaces for the first two bedrooms; each further bedroom adds 1. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 1, source: Z, assumption: "1 uncovered visitor space per home."}

simplifications:
  - "The 2/3 rule for top stories and this chapter's open space weren't applied, so floor area can run high; density binds on most lots."
