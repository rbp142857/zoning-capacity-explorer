# Bellflower R-1. Every value cites the Bellflower Municipal Code, Title 17 (eCode360, through Ord. 1461 of September 28, 2026, read 2026-11-02).
zone: "R-1"
name: "R-1 Low Density Residential"
family: single_family

sources:
  Z:
    section: "BMC §§17.24.020 and 17.24.060 to 17.24.130"
    url: https://ecode360.com/43108100

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family], source: Z}
min_lot_area_sqft: {value: 5000, source: Z}
lot_area_per_unit_sqft: {value: 5000, source: Z, assumption: "§17.24.100 sets 5,000 sq ft per dwelling unit, and §17.24.110 covers properties with two or more single-family homes, so a larger lot can hold more. SCAG drops any larger-lot suffix, so those lots can run high."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot of record under 5,000 sq ft keeps one home (§17.24.100)."
small_lot_units_below_sqft: 5000

setbacks:
  front_ft: {value: 20, source: Z}
  side_ft: {value: 5, source: Z}
  rear_ft: {value: 15, source: Z}

max_height_ft: {value: 30, source: Z}
max_stories: {value: 2, source: Z}
lot_coverage: {value: 0.45, source: Z}
parking_per_unit: {value: 2, source: Z}
