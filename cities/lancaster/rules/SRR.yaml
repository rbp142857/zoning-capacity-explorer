# Lancaster SRR. Every value cites the Lancaster Municipal Code, Title 17 (Municode, read 2026-11-01).
zone: "SRR"
name: "Semi-Rural Residential (SRR)"
family: single_family

sources:
  Z:
    section: "LMC Ch. 17.08 (Residential Zones)"
    url: https://library.municode.com/ca/lancaster/codes/code_of_ordinances?nodeId=TIT17ZO_CH17.08REZO

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family], source: Z}
min_lot_area_sqft: {value: 20000, source: Z}
max_units_per_lot: {value: 1, source: Z, assumption: "One home per lot. Duplexes on corner lots of 10,000 sq ft aren't modeled; ADUs and SB 9 are state law, modeled separately."}

setbacks:
  front_ft: {value: 30, source: Z}
  side_ft: {value: 10, source: Z, assumption: "Half the required sum of two side yards, where the code sets a sum."}
  rear_ft: {value: 20, source: Z}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 3, source: Z, assumption: "The code limits feet, not stories; we fit 3."}
lot_coverage: {value: 0.4, source: Z}
parking_per_unit: {value: 2, source: Z, assumption: "2 in an enclosed garage. None within ½ mile of a major transit stop (the AB 2097 path)."}
