# Lancaster MDR. Every value cites the Lancaster Municipal Code, Title 17 (Municode, read 2026-11-01).
zone: "MDR"
name: "Medium Density Residential (MDR)"
family: multifamily

sources:
  Z:
    section: "LMC Ch. 17.08 (Residential Zones)"
    url: https://library.municode.com/ca/lancaster/codes/code_of_ordinances?nodeId=TIT17ZO_CH17.08REZO

residential_allowed: {value: true, source: Z}
housing_types: {value: [multifamily], source: Z}
approval: {value: by_right, source: Z, assumption: "The uses matrix marks multi family P*, with site plan review, which isn't checked."}
min_lot_area_sqft: {value: 6000, source: Z}
lot_area_per_unit_sqft: {value: 2904, source: Z, assumption: "15 homes per acre. Per acre converted to land per home."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 2904

setbacks:
  front_ft: {value: 8, source: Z, assumption: "0, 8 or 20 ft by street type; we use 8 ft."}
  side_ft: {value: 10, source: Z}
  rear_ft: {value: 15, source: Z}

max_height_ft: {value: 55, source: Z, assumption: "55 ft, or 35 ft within 100 ft of a single-family zone. Larger complexes have 72 ft; we use 55 ft."}
max_stories: {value: 5, source: Z, assumption: "The code limits feet, not stories; we fit 5."}
lot_coverage: {value: 0.50, source: Z}
parking_per_unit: {value: 1.5, source: Z, assumption: "1.5 covered spaces per home in apartments of 5 or more. None within ½ mile of a major transit stop."}
guest_parking_per_unit: {value: 0.25, source: Z, assumption: "1 per 4 homes."}
guest_parking_min_units: 5

simplifications:
  - "Open space (8% of lot) and landscaping (15%) aren't modeled, so these can run high."
