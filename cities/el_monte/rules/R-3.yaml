# El Monte R-3. Every value cites the El Monte Municipal Code, Title 17 (Municode, Ord. No. 3053, read 2026-11-01).
zone: R-3
name: "Medium-density Multiple-family Dwelling (R-3)"
family: multifamily

sources:
  Z:
    section: "EMMC §17.24.050, Table 17.24-2"
    url: https://library.municode.com/ca/el_monte/codes/code_of_ordinances?nodeId=TIT17ZO_DIV2REZODIOV_CH17.24MUMIDWZODI_17.24.050DEST
  U:
    section: "EMMC Table 17.A-1 (citywide use matrix)"
    url: https://library.municode.com/ca/el_monte/codes/code_of_ordinances?nodeId=TIT17ZO_DIVACIMAPEUS_CH17.AMAPEUS_17.AMAPEUS
  P:
    section: "EMMC §17.70 Tables 17.70-2 and 17.70-3 (parking)"
    url: https://library.municode.com/ca/el_monte/codes/code_of_ordinances?nodeId=TIT17ZO_DIV7PALARE_CH17.70PARE

residential_allowed: {value: true, source: U}
housing_types: {value: [multifamily], source: U}
min_lot_area_sqft: {value: 6000, source: Z}
min_lot_width_ft: {value: 60, source: Z}
lot_area_per_unit_sqft:
  value:
    by: lot_width_ft
    bands:
      - {below: 101, value: 4356}
      - {below: 151, value: 3630}
      - {value: 3111}
  source: Z
  assumption: "The table's density rows are by street frontage; we use lot width for frontage."
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home's share of land keeps one home; one house on a lot is allowed (Table 17.A-1). This is our reading for existing lots."
small_lot_units_below_sqft: 4356

setbacks:
  front_ft: {value: 20, source: Z}
  side_ft: {value: 5, source: Z, assumption: "5 ft on the first story, 10 ft above; we use the first story, and street-side yards of 10 ft are not modeled."}
  rear_ft: {value: 10, source: Z, assumption: "10 ft, or 20 ft next to R-1; we use 10 ft."}

max_height_ft: {value: 30, source: Z}
max_stories: {value: 2, source: Z}
lot_coverage: {value: 0.4, source: Z}
max_far: {value: 0.5, source: Z, assumption: "Base FAR for 3 units. The FAR bonus of up to 0.20 (§17.24.050.C) needs points from affordable, green or design choices, and is left out (conservative)."}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces for a 1-bedroom home, a typical size here. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.25, source: P, assumption: "1 guest space per 4 homes for 3 or more homes; the minimum of 2 is not modeled."}
guest_parking_min_units: 3

simplifications:
  - "Upper-story setbacks, open space per home and building separation are not modeled; they can lower what fits."
