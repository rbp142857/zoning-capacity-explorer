# West Hollywood R2. Every value cites the West Hollywood Municipal Code, Title 19 (eCode360, read 2026-11-01).
zone: "R2"
name: "Two-Family and Low-Density (R2)"
family: multifamily

sources:
  Z:
    section: "WHMC §19.06.040, Table 2-3 and §19.06.050, Table 2-4"
    url: https://ecode360.com/43913027
  P:
    section: "WHMC §19.28, Table 3-6 (parking by land use)"
    url: https://ecode360.com/43927992

residential_allowed: {value: true, source: Z}
housing_types: {value: [two_unit, multifamily], source: Z}
min_lot_area_sqft: {value: 5000, source: Z}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {below: 4000, value: 2}
      - {below: 8000, value: 3}
      - {below: 10000, value: 4}
      - {below: 12000, value: 5}
      - {below: 14000, value: 6}
      - {below: 16000, value: 7}
      - {below: 18000, value: 8}
      - {below: 20000, value: 9}
      - {below: 22000, value: 10}
      - {below: 24000, value: 11}
      - {below: 26000, value: 12}
      - {below: 28000, value: 13}
      - {below: 30000, value: 14}
      - {below: 32000, value: 15}
      - {below: 34000, value: 16}
      - {below: 36000, value: 17}
      - {below: 38000, value: 18}
      - {value: 19}
  source: Z
small_lot_units_below_sqft: 38000
lot_area_per_unit_sqft: {value: 2000, source: Z, assumption: "Lots beyond the table use a flat 2,000 per home, slightly low."}

setbacks:
  front_ft: {value: 15, source: Z, assumption: "The average of neighbors, with this minimum; we use the minimum."}
  side_ft: {value: {pct_of_width: 0.1, min_ft: 3, max_ft: 5}, source: Z, assumption: "5 ft, or 10% of width (at least 3 ft) on narrow lots; plus 1 ft per story above the second in R3 and R4."}
  rear_ft: {value: 15, source: Z}

max_height_ft: {value: 25, source: Z}
max_stories: {value: 2, source: Z}
parking_per_unit: {value: 1.5, source: P, assumption: "1.5 spaces for a 1-bedroom home; none within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.25, source: P, assumption: "1 covered guest space per 4 homes, for 5 or more homes."}
guest_parking_min_units: 5

simplifications:
  - "Density bonuses and incentives (Ch. 19.22, §19.10.050) are not modeled, so numbers are base zoning only."
  - "Added 2nd-story front setback of 6 ft is not modeled."
