# Baldwin Park MU-2. Every value cites the Baldwin Park Code of Ordinances, Chapter 153 (American Legal, through legislation of 12-17-25, read 2026-11-02).
zone: "MU-2"
name: "Mixed-Use Zone 2 (MU-2)"
family: commercial

sources:
  Z:
    section: "BPC §§153.070.020 and 153.070.030"
    url: https://codelibrary.amlegal.com/codes/baldwinpark/latest/baldwinpark_ca/0-0-0-9755
  P:
    section: "BPC §153.150.040 (parking spaces required)"
    url: https://codelibrary.amlegal.com/codes/baldwinpark/latest/baldwinpark_ca/0-0-0-10566

residential_allowed: {value: true, source: Z, assumption: "Multiple-family homes are permitted; all new development must include a commercial component (§153.070.020(D))."}
housing_types: {value: [mixed_use, multifamily], source: Z}
min_lot_area_sqft: {value: 15000, source: Z}
min_lot_width_ft: {value: 40, source: Z}
lot_area_per_unit_sqft:
  value:
    by: lot_area_sqft
    bands:
      - {below: 20000, value: 2904}
      - {value: 1452}
  source: Z
  assumption: "15 homes per acre on parcels under 20,000 sq ft and 30 per acre above it. The table doesn't cover exactly 20,000 sq ft; we use 30 there."
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 2904

setbacks:
  front_ft: {value: 0, source: Z, assumption: "0 ft; ground-floor homes need 10 ft, not modeled."}
  side_ft: {value: 10, source: Z}
  rear_ft: {value: 15, source: Z}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 2, source: Z, assumption: "The code limits height to 35 ft, not stories; we fit 2 (conservative)."}
lot_coverage: {value: 0.6, source: Z}
max_far: {value: 2.0, source: Z, assumption: "For mixed-use development."}
parking_per_unit: {value: 2, source: P, assumption: "Apartments: 1 carport space and 1 other space per home. Efficiency apartments need 1. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.33, source: P, assumption: "1 guest space per 3 homes."}

simplifications:
  - "The required commercial space isn't subtracted, and we count all floor area as homes up to the density, so these can run high. Open space of 136 sq ft per home is not modeled. "
