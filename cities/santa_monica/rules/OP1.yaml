# Santa Monica OP1. Every value cites the Santa Monica Municipal Code Article 9 (eCode360, through Ord. No. 2862CCS, adopted July 28, 2026).
# Zones come from SCAG's countywide table. Ord. No. 2865CCS (Sept. 22, 2026)
# amends the base districts but was not yet in the online code; re-check.
zone: OP1
name: "Ocean Park Single Unit Residential (OP1)"
family: single_family

sources:
  U09:
    section: "SMMC §9.09.020, Table 9.09.020 (Ocean Park land uses)"
    url: https://ecode360.com/42746777
  T09:
    section: "SMMC §9.09.030, Table 9.09.030 and subsections (Ocean Park standards)"
    url: https://ecode360.com/42746777
  P28:
    section: "SMMC §9.28.060 and Table 9.28.060 (parking; no minimum for housing projects outside R1 and OP1)"
    url: https://ecode360.com/42747771

residential_allowed: {value: true, source: U09}
housing_types: {value: [single_family], source: U09}
min_lot_area_sqft: {value: 4000, source: T09}
min_lot_width_ft: {value: 25, source: T09}
max_units_per_lot: {value: 1, source: T09, assumption: "1 home per parcel; duplexes under §9.31.125 (SB 9) are modeled by the state-law path."}

setbacks:
  front_ft: {value: 15, source: T09, assumption: "15 ft (10 ft where neighbors average 15 ft or less); we use 15 ft."}
  side_ft: {value: {pct_of_width: 0.10, min_ft: 3, max_ft: 10}, source: T09, assumption: "Greater of 4 ft or 10% of width (3 ft on lots under 35 ft wide); we use 10%, at least 3 ft."}
  rear_ft: {value: 10, source: T09}

max_height_ft: {value: 20, source: T09, assumption: "20 ft flat roof, 27 ft pitched."}
max_stories: {value: 2, source: T09}
max_floor_area:
  value:
    by: lot_width_ft
    bands:
      - {below: 35, share: 1.1}
      - {share: 1.0}
  source: T09
  assumption: "FAR 1.0, or 1.1 on lots under 35 ft wide."
parking_per_unit: {value: 2, source: P28, assumption: "2 spaces per single-unit home outside ½ mile of a major transit stop."}
