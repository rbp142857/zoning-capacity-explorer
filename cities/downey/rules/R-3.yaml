# Downey R-3. Every value cites the Downey Municipal Code, Article IX (eCode360, through Ord. 25-1520), read 2026-11-03.
zone: R-3
name: Multiple-Family Residential (R-3)
family: multifamily
sources:
  Z: {section: 'DMC §9312.06, Table 9.3.2 (uses); §9312.08, Tables 9.3.3 and 9.3.4 (standards)', url: 'https://ecode360.com/44400897'}
  P: {section: 'DMC Ch. 7, Table 9.7.2 (residential parking)', url: 'https://ecode360.com/44402935'}
residential_allowed: {value: true, source: Z}
housing_types:
  value: [single_family, two_unit, multifamily]
  source: Z
approval: {value: by_right, source: Z, assumption: Table 9.3.2 marks apartments and condominiums P.}
min_lot_area_sqft: {value: 10000, source: Z}
min_lot_width_ft: {value: 100, source: Z}
lot_area_per_unit_sqft:
  value:
    by: lot_area_sqft
    bands:
    - {below: 15001, value: 1980}
    - {value: 1815}
  source: Z
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
    - {value: 1}
  source: Z
  assumption: A lot too small for one home keeps one home (assumed).
small_lot_units_below_sqft: 1980
setbacks:
  front_ft: {value: 15, source: Z}
  side_ft: {value: 5, source: Z}
  rear_ft: {value: 20, source: Z, assumption: 'Rear yard depends on what it abuts: for three stories 46 ft next to R-1 and 26 ft next to an alley. We use 20 ft, the one-story figure next to R-1, so some lots run high.'}
max_height_ft: {value: 35, source: Z}
max_stories: {value: 3, source: Z}
lot_coverage: {value: 0.5, source: Z}
parking_per_unit: {value: 2, source: P, assumption: 2 covered spaces. None within ½ mile of a major transit stop (the AB 2097 path).}
guest_parking_per_unit: {value: 0.5, source: P}
guest_parking_min_units: 2
simplifications: ['Open space of 200 sq ft per home isn''t modeled, so these can run high.']
