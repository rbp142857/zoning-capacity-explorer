# Calabasas RM. Every value cites the Calabasas Municipal Code, Title 17 (Municode, read 2026-11-02).
zone: "RM"
name: "Residential, Multifamily (RM)"
family: multifamily

sources:
  Z:
    section: "CMC §17.11.010 Table 2-2 and §§17.13.020 and 17.12.030"
    url: https://library.municode.com/ca/city_of_calabasas/codes/code_of_ordinances?nodeId=TIT17LAUSDE_ARTIIZODIALLAUS_CH17.13REDI
  P:
    section: "CMC Ch. 17.28, Table 3-11"
    url: https://library.municode.com/ca/city_of_calabasas/codes/code_of_ordinances?nodeId=TIT17LAUSDE_ARTIIISIPLPRDEST_CH17.28PALO

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family, two_unit, multifamily], source: Z}
min_lot_area_sqft: {value: 5000, source: Z}
min_lot_width_ft: {value: 50, source: Z}
lot_area_per_unit_sqft: {value: 1815, source: Z, assumption: "24 homes per acre: 43,560 divided by 24. A zoning map suffix (such as RM-12D) can lower this, and SCAG drops suffixes, so we can't see it. Lots with a lower suffix run high; see the open decision."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 1815

setbacks:
  front_ft: {value: 20, source: Z}
  side_ft: {value: 10, source: Z}
  rear_ft: {value: 20, source: Z}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 2, source: Z, assumption: "The table limits height to 35 ft, not stories; we fit 2 (conservative)."}
lot_coverage: {value: 0.55, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces for two bedrooms; 1.5 for one, 1 for a studio; 0.5 more per bedroom over two. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.33, source: P, assumption: "1 guest space per 3 homes."}

simplifications:
  - "Density above the minimum needs the impact findings in Ch. 17.60, not modeled. Lots over the hillside threshold follow §17.20.150, and we have no slope data, so hilly lots can run high."
