# Los Angeles [LN1-MU1-5][RG1-FA]. Chapter 1A (new zoning code), read on zoning.lacity.gov on 2026-11-01.
zone: "[LN1-MU1-5][RG1-FA]"
name: "LN1 form, MU1 frontage, Standards 5, RG1 use, FA density"
family: multifamily

sources:
  F:
    section: "LA Zoning Code (Ch. 1A) Sec. 2B.8.1 (LN1 Form District)"
    url: https://zoning.lacity.gov/browse/2#2B.8.1
  U:
    section: "LA Zoning Code (Ch. 1A) Sec. 5B.3.1 (RG1 Use District)"
    url: https://zoning.lacity.gov/browse/5#5B.3.1
  D:
    section: "LA Zoning Code (Ch. 1A) Part 6B (Density Districts)"
    url: https://zoning.lacity.gov/browse/6#6B
  P:
    section: "LA Zoning Code (Ch. 1A) Sec. 4C.4.1, Table 1 (Package A, assigned by Development Standards District 5)"
    url: https://zoning.lacity.gov/browse/4#4C.4.1

residential_allowed: {value: true, source: U, assumption: "Dwellings are allowed through the Inclusionary Housing Program (Sec. 5C.3.1), so a share of homes must be affordable; we count all of them."}
housing_types: {value: [multifamily], source: U}
min_lot_area_sqft: {value: 2500, source: F}
min_lot_width_ft: {value: 25, source: F}

setbacks:
  front_ft: {value: 5, source: F}
  side_ft: {value: 0, source: F}
  rear_ft: {value: 0, source: F}

max_stories: {value: 3, source: F, assumption: "Stated in the Form District."}
lot_coverage: {value: 0.8, source: F}
max_far: {value: 1.5, source: F, assumption: "Base FAR, without public benefit bonuses."}

simplifications:
  - "Base floor area only. Bonus floor area and density come through the public benefit programs in Article 9, so these can be far below what a project with affordable homes can reach."
  - "Lot and residential amenity space, building width, step-backs and frontage rules are not modeled; they can lower what fits."
  - "All-residential building assumed."
