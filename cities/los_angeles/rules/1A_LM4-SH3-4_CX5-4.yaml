# Los Angeles [LM4-SH3-4][CX5-4]. Chapter 1A (new zoning code), read on zoning.lacity.gov on 2026-11-01.
zone: "[LM4-SH3-4][CX5-4]"
name: "LM4 form, SH3 frontage, Standards 4, CX5 use, 4 density"
family: commercial

sources:
  F:
    section: "LA Zoning Code (Ch. 1A) Sec. 2B.9.4 (LM4 Form District)"
    url: https://zoning.lacity.gov/browse/2#2B.9.4
  U:
    section: "LA Zoning Code (Ch. 1A) Sec. 5B.5.5 (CX5 Use District)"
    url: https://zoning.lacity.gov/browse/5#5B.5.5
  D:
    section: "LA Zoning Code (Ch. 1A) Part 6B (Density Districts)"
    url: https://zoning.lacity.gov/browse/6#6B
  P:
    section: "LA Zoning Code (Ch. 1A) Sec. 4C.4.1, Table 1 (Package A, assigned by Development Standards District 4)"
    url: https://zoning.lacity.gov/browse/4#4C.4.1

residential_allowed: {value: true, source: U, assumption: "Dwellings are allowed in this district."}
housing_types: {value: [mixed_use, multifamily], source: U}
min_lot_width_ft: {value: 20, source: F}
lot_area_per_unit_sqft: {value: 400, source: D}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: D
  assumption: "A lot too small for one home's share of land keeps one home. We assume this; see Article 12."
small_lot_units_below_sqft: 400

setbacks:
  front_ft: {value: 0, source: F}
  side_ft: {value: 0, source: F}
  rear_ft: {value: 0, source: F}

max_stories: {value: 2, source: F, assumption: "The Form District sets no height limit, so floor area limits the building. We use the fewest stories that reach it."}
lot_coverage: {value: 1.0, source: F}
max_far: {value: 1.5, source: F, assumption: "Base FAR, without public benefit bonuses."}

simplifications:
  - "Base floor area only. Bonus floor area and density come through the public benefit programs in Article 9, so these can be far below what a project with affordable homes can reach."
  - "Lot and residential amenity space, building width, step-backs and frontage rules are not modeled; they can lower what fits."
  - "All-residential building assumed."
