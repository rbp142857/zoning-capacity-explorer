# Los Angeles [LM3-G2-3][CX2-8]. Chapter 1A (new zoning code), read on zoning.lacity.gov on 2026-11-01.
zone: "[LM3-G2-3][CX2-8]"
name: "LM3 form, G2 frontage, Standards 3, CX2 use, 8 density"
family: commercial

sources:
  F:
    section: "LA Zoning Code (Ch. 1A) Sec. 2B.9.3 (LM3 Form District)"
    url: https://zoning.lacity.gov/browse/2#2B.9.3
  U:
    section: "LA Zoning Code (Ch. 1A) Sec. 5B.5.2 (CX2 Use District)"
    url: https://zoning.lacity.gov/browse/5#5B.5.2
  D:
    section: "LA Zoning Code (Ch. 1A) Part 6B (Density Districts)"
    url: https://zoning.lacity.gov/browse/6#6B
  P:
    section: "LA Zoning Code (Ch. 1A) Sec. 4C.4.1, Table 1 (Package C, assigned by Development Standards District 3)"
    url: https://zoning.lacity.gov/browse/4#4C.4.1

residential_allowed: {value: true, source: U, assumption: "Dwellings are allowed through the Inclusionary Housing Program (Sec. 5C.3.1), so a share of homes must be affordable; we count all of them."}
housing_types: {value: [mixed_use, multifamily], source: U}
min_lot_width_ft: {value: 20, source: F}
lot_area_per_unit_sqft: {value: 800, source: D}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: D
  assumption: "A lot too small for one home's share of land keeps one home. We assume this; see Article 12."
small_lot_units_below_sqft: 800

setbacks:
  front_ft: {value: 0, source: F}
  side_ft: {value: 0, source: F}
  rear_ft: {value: 10, source: F}

max_stories: {value: 2, source: F, assumption: "Stated in the Form District."}
lot_coverage: {value: 1.0, source: F}
max_far: {value: 1.5, source: F, assumption: "Base FAR, without public benefit bonuses."}
parking_per_unit: {value: 0.5, source: P, assumption: "0.5 per home of 1-4 habitable rooms, 1 for 5 or more; we use the smaller home. None within ½ mile of a major transit stop (the AB 2097 path)."}

simplifications:
  - "Base floor area only. Bonus floor area and density come through the public benefit programs in Article 9, so these can be far below what a project with affordable homes can reach."
  - "Lot and residential amenity space, building width, step-backs and frontage rules are not modeled; they can lower what fits."
  - "All-residential building assumed."
