# Los Angeles M2. Every value cites the Los Angeles Municipal Code (American Legal, read 2026-11-01).
zone: M2
name: "Light Industrial (M2)"
family: nonresidential

sources:
  Z:
    section: "LAMC §12.19 (M2 zone; excludes buildings with dwelling units)"
    url: https://codelibrary.amlegal.com/codes/los_angeles/latest/lamc/0-0-0-111764

residential_allowed: {value: false, source: Z, assumption: "Only a guard's or caretaker's home is allowed, as an accessory use. The section still has lot-area rules for dwellings, but its use list does not allow them, so existing homes here are nonconforming."}
housing_types: {value: [], source: Z}
approval: {value: not_allowed, source: Z, assumption: "Only a guard's or caretaker's home, or no homes, in the section's use list."}

setbacks:
  front_ft: {value: 0, source: Z}
  side_ft: {value: 0, source: Z}
  rear_ft: {value: 0, source: Z}
max_stories: {value: 0, source: Z, assumption: "Not relevant: housing not allowed."}
