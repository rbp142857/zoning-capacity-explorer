# South Gate NL. Every value cites the South Gate Municipal Code, Title 11 (eCode360, read 2026-11-01).
zone: "NL"
name: "Neighborhood Low (NL)"
family: single_family

sources:
  Z:
    section: "SGMC Ch. 11.25, Table 11.25-1"
    url: https://ecode360.com/48149520

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family], source: Z}
approval: {value: by_right, source: Z, assumption: "Table 11.21-5 marks duplex and single-family homes P."}
min_lot_area_sqft: {value: 5000, source: Z}
min_lot_width_ft: {value: 50, source: Z}
max_units_per_lot: {value: 1, source: Z, assumption: "The table allows up to 5 homes per acre, and at most 2 separate living units on a 5,000 sq ft lot. We read the second as an ADU, which the state-law path counts. So one main home per lot; a duplex reading would add capacity."}

setbacks:
  front_ft: {value: 20, source: Z}
  side_ft: {value: 5, source: Z}
  rear_ft: {value: 5, source: Z}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 2.5, source: Z}
lot_coverage: {value: 0.40, source: Z}

simplifications:
  - "NL2 small lots (Table 11.25-2) are not separated from NL1 in our data. Parking wasn't read; the one-home limit binds."
