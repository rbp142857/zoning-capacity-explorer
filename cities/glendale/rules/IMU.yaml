# Glendale IMU. Every value cites Glendale Municipal Code Title 30 (eCode360, through Ord. No. 6052 (May 19, 2026)).
# Zones come from SCAG's countywide table, which has no overlay districts (historic, height, FAR).
zone: IMU
name: "Industrial/Commercial Mixed Use (IMU)"
family: nonresidential

sources:
