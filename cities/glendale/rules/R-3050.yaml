# Glendale R-3050. Every value cites Glendale Municipal Code Title 30 (eCode360, through Ord. No. 6052 (May 19, 2026)).
# Zones come from SCAG's countywide table, which has no overlay districts (historic, height, FAR).
zone: R-3050
name: "Multi-Family Residential (R-3050)"
family: multifamily

sources:
  T11A:
    section: "GMC §30.11.020, Table 30.11-A (residential uses)"
    url: https://ecode360.com/43352065
  T11MF:
    section: "GMC §30.11.050 (R-3050, R-2250, R-1650, R-1250 standards table)"
    url: https://ecode360.com/43352065
  T32A:
    section: "GMC §30.32, Table 30-32-A (residential parking)"
    url: https://ecode360.com/43353043

residential_allowed: {value: true, source: T11A}
housing_types: {value: [single_family, multifamily], source: T11A}

lot_area_per_unit_sqft: {value: 3050, source: T11MF}
density_rounding: {value: floor, source: T11MF, assumption: "The code states no rounding rule; fractions are rounded down."}

setbacks:
  front_ft: {value: 25, source: T11MF}
  side_ft: {value: 8, source: T11MF, assumption: "5 ft minimum, 8 ft average; we use the average."}
  rear_ft: {value: 8, source: T11MF, assumption: "Interior setback (5 ft minimum, 8 ft average) applied to the rear; we use the average."}

max_height_ft: {value: 36, source: T11MF}
max_stories: {value: 3, source: T11MF, assumption: "Maximum of 3 stories and 36 ft."}
lot_coverage: {value: 0.5, source: T11MF}
max_far: {value: 0.65, source: T11MF}
min_open_space_share: {value: 0.25, source: T11MF, assumption: "Minimum permanently landscaped open space."}

parking_per_unit: {value: 2, source: T32A, assumption: "Units of up to 2 bedrooms need 2 spaces; our assumed 850 sq ft home is in that range."}
guest_parking_per_unit: {value: 0.25, source: T32A}
guest_parking_min_units: 4

simplifications:
  - "Objective design standards (Ch. 30.17) step-backs and modulation not modeled."
  - "Extra setbacks next to single-family zones not modeled."
