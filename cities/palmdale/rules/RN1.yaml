# Palmdale RN1. Every value cites the Palmdale Municipal Code, Title 17 (eCode360, read 2026-11-01).
zone: "RN1"
name: "Residential Neighborhood 1 (RN 1)"
family: multifamily

sources:
  Z:
    section: "PMC §17.36.010, Tables 17.36.010-1 and -2"
    url: https://ecode360.com/46603435
  P:
    section: "PMC Ch. 17.87 (Off-Street Parking and Loading)"
    url: https://ecode360.com/46604288

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family, two_unit], source: Z}
approval: {value: by_right, source: Z, assumption: "Chapter 17.35's table marks single-family, two-family and triplex dwellings P."}
lot_area_per_unit_sqft: {value: 4356, source: Z, assumption: "10 homes per acre: 43,560 divided by 10."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 4356

setbacks:
  front_ft: {value: 10, source: Z}
  side_ft: {value: 5, source: Z}
  rear_ft: {value: 15, source: Z}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 2, source: Z, assumption: "The table allows 2.5 stories; we use 2 (conservative)."}
lot_coverage: {value: 0.60, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces per home. None within ½ mile of a major transit stop (the AB 2097 path)."}

simplifications:
  - "RN 1 appears only in the single-family table, so we read it as attached and detached homes, not apartments."
