# Palmdale EDFX. Every value cites the Palmdale Municipal Code, Title 17 (eCode360, read 2026-11-01).
zone: "EDFX"
name: "Educational Flex (EDFX)"
family: commercial

sources:
  Z:
    section: "PMC Ch. 17.48, Table 17.48.010-1"
    url: https://ecode360.com/46603696
  P:
    section: "PMC Ch. 17.87 (Off-Street Parking and Loading)"
    url: https://ecode360.com/46604288

residential_allowed: {value: true, source: Z}
housing_types: {value: [multifamily, mixed_use], source: Z}
approval: {value: conditional, source: Z, assumption: "Chapter 17.47's table marks multifamily residential CUP."}
lot_area_per_unit_sqft: {value: 1452, source: Z, assumption: "30 homes per acre: 43,560 divided by 30."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 1452

setbacks:
  front_ft: {value: 10, source: Z}
  side_ft: {value: 10, source: Z, assumption: "10 ft; 25 ft next to a residential zone, not modeled."}
  rear_ft: {value: 10, source: Z}

max_height_ft: {value: 65, source: Z}
max_stories: {value: 5, source: Z}
max_far: {value: 2.0, source: Z}
parking_per_unit: {value: 1.5, source: P, assumption: "1.5 spaces for a two-bedroom home in buildings of 5 or more; smaller buildings need 2. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.2, source: P, assumption: "0.2 guest space per home at 5 or more homes."}
guest_parking_min_units: 5
