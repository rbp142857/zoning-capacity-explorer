# Palmdale RN4. Every value cites the Palmdale Municipal Code, Title 17 (eCode360, read 2026-11-01).
zone: "RN4"
name: "Residential Neighborhood 4 (RN 4)"
family: multifamily

sources:
  Z:
    section: "PMC §17.36.010, Tables 17.36.010-1 and -2"
    url: https://ecode360.com/46603435
  P:
    section: "PMC Ch. 17.87 (Off-Street Parking and Loading)"
    url: https://ecode360.com/46604288

residential_allowed: {value: true, source: Z}
housing_types: {value: [multifamily], source: Z}
lot_area_per_unit_sqft: {value: 871.2, source: Z, assumption: "50 homes per acre: 43,560 divided by 50."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 871.2

setbacks:
  front_ft: {value: 15, source: Z}
  side_ft: {value: 10, source: Z, assumption: "More next to single-family zoned property, not modeled."}
  rear_ft: {value: 15, source: Z}

max_height_ft: {value: 60, source: Z}
max_stories: {value: 5, source: Z}
parking_per_unit: {value: 1.5, source: P, assumption: "1.5 spaces for a two-bedroom home in buildings of 5 or more; smaller buildings need 2. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.2, source: P, assumption: "0.2 guest space per home at 5 or more homes."}
guest_parking_min_units: 5

simplifications:
  - "A step-back next to single-family zones and open space per home are not modeled."
  - "A minimum density and a minimum site for new lots apply to new development; existing lots keep their density here."
