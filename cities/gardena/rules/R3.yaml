# Gardena R3. Every value cites the Gardena Municipal Code, Title 18 (eCode360, read 2026-11-01).
zone: "R3"
name: "Medium Density Multifamily (R-3)"
family: multifamily

sources:
  Z:
    section: "GMC §18.16.050"
    url: https://ecode360.com/48208495
  P:
    section: "GMC Ch. 18.40 (off-street parking)"
    url: https://ecode360.com/48209742

residential_allowed: {value: true, source: Z}
housing_types: {value: [multifamily], source: Z}
min_lot_area_sqft: {value: 5000, source: Z}
lot_area_per_unit_sqft: {value: 2562.35, source: Z, assumption: "Homes per acre converted to land per home."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 2562.35
density_rounding: {value: nearest_half_up, source: Z}

setbacks:
  front_ft: {value: 20, source: Z}
  side_ft: {value: 7.5, source: Z}
  rear_ft: {value: 7.5, source: Z}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 3, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces per home. None within ½ mile of a major transit stop (the AB 2097 path)."}
