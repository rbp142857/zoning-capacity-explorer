# Artesia R-1. Every value cites the Artesia Municipal Code, Title 9, Chapter 2 (eCode360, code dated 2026-04-13, read 2026-11-02).
zone: "R-1"
name: "Single-Family Residential (R-1)"
family: single_family

sources:
  Z:
    section: "AMC §§9-2.2802 and 9-2.2805"
    url: https://ecode360.com/43221346

residential_allowed: {value: true, source: Z}
