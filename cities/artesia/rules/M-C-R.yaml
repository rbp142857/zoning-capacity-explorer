# Artesia M-C-R. Every value cites the Artesia Municipal Code, Title 9, Chapter 2 (eCode360, code dated 2026-04-13, read 2026-11-02).
zone: "M-C-R"
name: "Mixed Commercial/Single-Family Residential (M-C-R)"
family: commercial

sources:
  Z:
    section: "AMC Art. 29.6 (§9-2.2962 and development standards)"
    url: https://ecode360.com/43221602

residential_allowed: {value: true, source: Z, assumption: "R-1's principal uses are allowed, so one home per lot."}
housing_types: {value: [single_family], source: Z}
min_lot_area_sqft: {value: 5000, source: Z}
min_lot_width_ft: {value: 50, source: Z}
max_units_per_lot: {value: 1, source: Z}

setbacks:
  front_ft: {value: 20, source: Z}
  side_ft: {value: {pct_of_width: 0.10, min_ft: 3, max_ft: 5}, source: Z}
  rear_ft: {value: 5, source: Z}

max_height_ft: {value: 30, source: Z}
max_stories: {value: 2, source: Z, assumption: "The zone limits height to 30 ft, not stories; we fit 2."}

simplifications:
  - "Modeled as commercial, so SB 9 isn't applied (conservative); ADU law is. Commercial uses have other yards and aren't modeled."
