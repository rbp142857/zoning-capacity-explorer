# Artesia M-D-R. Every value cites the Artesia Municipal Code, Title 9, Chapter 2 (eCode360, code dated 2026-04-13, read 2026-11-02).
zone: "M-D-R"
name: "Medium Density Residential (M-D-R)"
family: multifamily

sources:
  Z:
    section: "AMC §§9-2.2951 and 9-2.2953"
    url: https://ecode360.com/43221569

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family, two_unit], source: Z}
approval: {value: by_right, source: Z, assumption: "Homes are listed as principal permitted uses."}
min_lot_area_sqft: {value: 3800, source: Z}
min_lot_width_ft: {value: 45, source: Z}
max_units_per_lot: {value: 2, source: Z, assumption: "R-1 uses or an attached duplex. The article has no separate lot area per home."}

setbacks:
  front_ft: {value: 14, source: Z}
  side_ft: {value: 5, source: Z}
  rear_ft: {value: 16, source: Z}

max_height_ft: {value: 30, source: Z}
max_stories: {value: 2, source: Z}
lot_coverage: {value: 0.50, source: Z}
min_open_space_share: {value: 0.09, source: Z}
parking_per_unit: {value: 2, source: Z, assumption: "2 garage spaces with up to 4 bedrooms; 3 with more."}
