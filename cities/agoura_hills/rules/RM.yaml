# Agoura Hills RM. Every value cites the Agoura Hills Municipal Code, Article IX (Municode, read 2026-11-02).
zone: "RM"
name: "Residential, Medium Density (RM)"
family: multifamily

sources:
  Z:
    section: "AHMC §§9253.1 to 9253.6"
    url: https://library.municode.com/ca/agoura_hills/codes/code_of_ordinances?nodeId=ARTIXZO_CH2RELAUSDI_PT6RMREDIDEDI
  P:
    section: "AHMC §9654.2 parking table (Ch. 6, Part 2, Div. 4)"
    url: https://library.municode.com/ca/agoura_hills/codes/code_of_ordinances?nodeId=ARTIXZO_CH6REPR_PT2SPRE_DIV4OREPALOLA

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family, multifamily], source: Z}
approval: {value: mixed, source: Z, assumption: "Apartment houses need a conditional use permit (§9252.4); other homes weren't confirmed."}
min_lot_area_sqft: {value: 6000, source: Z}
min_lot_width_ft: {value: 50, source: Z}
lot_area_per_unit_sqft: {value: 6000, source: Z, assumption: "SCAG drops the number after the zone letters, so we use the lowest density of the range, RM-6 (6,000 sq ft per home); lots zoned higher run low."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 6000

setbacks:
  front_ft: {value: 15, source: Z}
  side_ft: {value: 7, source: Z}
  rear_ft: {value: 15, source: Z}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 2, source: Z}
lot_coverage: {value: 0.6, source: Z}

parking_per_unit: {value: 2.5, source: P, assumption: "One bedroom and up, condominiums and townhouses need 2.5 spaces (2 or 1.5 covered plus guest spaces); studios need 1.5. We use 2.5. None within ½ mile of a major transit stop (the AB 2097 path)."}

simplifications:
  - "Apartment houses need a conditional use permit (§9252.4); other homes don't. Lots over 10% average slope follow the hillside rules (§9652), and we have no slope data, so hilly lots can run high."
  - "250 sq ft of group open space per home is not modeled. The Affordable Housing overlay (20 to 25 per acre on RM-15 sites) isn't in our data."
