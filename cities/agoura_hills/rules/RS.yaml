# Agoura Hills RS. Every value cites the Agoura Hills Municipal Code, Article IX (Municode, read 2026-11-02).
zone: "RS"
name: "Residential, Single-Family (RS)"
family: single_family

sources:
  Z:
    section: "AHMC §§9243.1 to 9243.5"
    url: https://library.municode.com/ca/agoura_hills/codes/code_of_ordinances?nodeId=ARTIXZO_CH2RELAUSDI_PT5RSRENGMIDI

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family], source: Z}
min_lot_area_sqft: {value: 6000, source: Z, assumption: "The smallest of the range (RS-6-6,000); SCAG drops the suffix."}
max_units_per_lot: {value: 1, source: Z, assumption: "One home per lot. The zone's density and minimum lot govern subdividing. State law (ADU, SB 9, Ch. 2 Part 11) is modeled separately."}

setbacks:
  front_ft: {value: 20, source: Z}
  side_ft: {value: 9, source: Z, assumption: "Lots under 10,000 sq ft: 18 ft combined, at least 8 ft on one side; we use 9 ft each. Larger lots use 22 ft combined and 25 ft front and rear, not modeled, so large lots can run high."}
  rear_ft: {value: 20, source: Z}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 2, source: Z}
lot_coverage:
  value:
    by: lot_area_sqft
    bands:
      - {below: 10000, share: 0.50}
      - {share: 0.35}
  source: Z

simplifications:
  - "Parking (2 covered spaces, §9654.2) isn't modeled; the one-home limit binds. Lots over 10% average slope follow the hillside rules (§9652), and we have no slope data."
  - "SCAG drops the density and lot size after RS (RS-2-15,000 through RS-6-6,000)."
