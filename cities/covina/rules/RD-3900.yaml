# Covina RD-3900. Every value cites the Covina Municipal Code, Title 17 (eCode360, read 2026-11-03).
zone: "RD-3900"
name: "RD-3900 Multiple-Family"
family: multifamily

sources:
  Z:
    section: "CMC §§17.28.020 to 17.28.040 and 17.72"
    url: https://ecode360.com/46919878

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family, two_unit, multifamily], source: Z}
approval: {value: by_right, source: Z, assumption: "Table 17.28.030 marks townhouses and apartments P."}
min_lot_area_sqft: {value: 15000, source: Z, assumption: "The minimum for attached housing types."}
lot_area_per_unit_sqft:
  value:
    by: lot_area_sqft
    bands:
      - {below: 15000, value: 4356}
      - {value: 3900}
  source: Z
  assumption: "Under 15,000 sq ft, the RD figure, but no more than the table's 10 per acre (4,356 sq ft per home). At 15,000 sq ft and up, the RD figure."
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "An existing lot too small for one home at this density keeps one."
small_lot_units_below_sqft: 4356

setbacks:
  front_ft: {value: 20, source: Z}
  side_ft: {value: 10, source: Z, assumption: "The second-story figure; 5 ft on the first story. We use it for the whole building (conservative)."}
  rear_ft: {value: 25, source: Z, assumption: "The second-story figure; 15 ft on the first story. We use it for the whole building (conservative)."}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 2, source: Z}
parking_per_unit: {value: 2, source: Z, assumption: "2 covered spaces for a two-bedroom home. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.2, source: Z, assumption: "1 guest space per 5 homes."}

simplifications:
  - "Private and common open space (220 sq ft per home) and the 2021 objective design standards aren't modeled."
