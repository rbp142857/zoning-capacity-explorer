# Covina RD-2950. Every value cites the Covina Municipal Code, Title 17 (eCode360, read 2026-11-03).
zone: "RD-2950"
name: "RD-2950 Multiple-Family"
family: multifamily

sources:
  Z:
    section: "CMC §§17.28.020 to 17.28.040 and 17.72"
    url: https://ecode360.com/46919878

residential_allowed: {value: true, source: Z}
housing_types: {value: [two_unit, multifamily], source: Z}
min_lot_area_sqft: {value: 15000, source: Z, assumption: "The minimum for attached housing types."}
lot_area_per_unit_sqft:
  value:
    by: lot_area_sqft
    bands:
      - {below: 15000, value: 3090}
      - {value: 2950}
  source: Z
  assumption: "Lots under 15,000 sq ft can't hold attached homes as new lots and detached homes aren't allowed in RD 3000 or less, so note 2 limits them to the bottom of the range, 14.1 per acre (conservative). At 15,000 sq ft and up, the RD figure, but no more than the table's 22 per acre."
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "An existing lot too small for one home at this density keeps one."
small_lot_units_below_sqft: 3090

setbacks:
  front_ft: {value: 15, source: Z}
  side_ft: {value: 10, source: Z, assumption: "The second-story figure; 5 ft on the first story. We use it for the whole building (conservative)."}
  rear_ft: {value: 20, source: Z, assumption: "The second-story figure; 15 ft on the first story. We use it for the whole building (conservative)."}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 3, source: Z}
lot_coverage: {value: 0.35, source: Z}
parking_per_unit: {value: 2, source: Z, assumption: "2 covered spaces for a two-bedroom home. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.2, source: Z, assumption: "1 guest space per 5 homes."}

simplifications:
  - "Private and common open space (220 sq ft per home) and the 2021 objective design standards aren't modeled."
