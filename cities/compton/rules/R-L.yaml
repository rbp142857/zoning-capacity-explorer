# Compton R-L. Every value cites the Compton Municipal Code, Chapter 30 (eCode360, through July 14, 2026, read 2026-11-03).
zone: "R-L"
name: "R-L Low-Density Residential"
family: single_family

sources:
  Z:
    section: "CMC §§30-8.2, 30-8.3 and 30-21.3"
    url: https://ecode360.com/35622209

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family], source: Z}
approval: {value: by_right, source: Z, assumption: "One-family dwellings are principal permitted uses (§§30-7.2, 30-8.2)."}
min_lot_area_sqft: {value: 5000, source: Z}
lot_area_per_unit_sqft: {value: 5000, source: Z, assumption: "More than one home may share a lot only if each could be legally divided off and fits the original subdivision (§30-8.3.b). We don't test that, so larger lots can run high."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "An existing smaller lot keeps one home. §30-20.2 accepts a smaller lot's area only if its deed was recorded before September 20, 1946; we can't tell which are, so we count one for all."
small_lot_units_below_sqft: 5000

setbacks:
  front_ft: {value: 20, source: Z}
  side_ft: {value: 5, source: Z, assumption: "3 ft for one story; 5 ft for two or more stories and on a street side."}
  rear_ft: {value: 20, source: Z, assumption: "20 ft; lots 90 ft deep or less may use 20% of depth, at least 10 ft, which isn't modeled."}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 2, source: Z, assumption: "The code limits height to 35 ft, not stories; we fit 2 (conservative)."}
parking_per_unit: {value: 2, source: Z, assumption: "2 enclosed spaces per home. None within ½ mile of a major transit stop (the AB 2097 path)."}

simplifications:
  - "Each home must be 1,200 to 3,000 sq ft (§30-8.3.c). That isn't modeled; density binds on most lots."
