# Compton R-M. Every value cites the Compton Municipal Code, Chapter 30 (eCode360, through July 14, 2026, read 2026-11-03).
zone: "R-M"
name: "R-M Medium-Density Residential"
family: multifamily

sources:
  Z:
    section: "CMC §§30-9.2, 30-9.3 and 30-21.3"
    url: https://ecode360.com/35622209

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family, two_unit, multifamily], source: Z, assumption: "Up to four homes by right; five or more on a parcel need a conditional use permit, which we assume is granted."}
min_lot_area_sqft: {value: 5000, source: Z}
lot_area_per_unit_sqft: {value: 2500, source: Z}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "An existing smaller lot keeps one home. §30-20.2 accepts a smaller lot's area only if its deed was recorded before September 20, 1946; we can't tell which are, so we count one for all."
small_lot_units_below_sqft: 2500

setbacks:
  front_ft: {value: 20, source: Z}
  side_ft: {value: 5, source: Z, assumption: "3 ft for one story; 5 ft for two or more stories and on a street side."}
  rear_ft: {value: 20, source: Z, assumption: "20 ft; lots 90 ft deep or less may use 20% of depth, at least 10 ft, which isn't modeled."}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 3, source: Z, assumption: "The code limits feet, not stories; we fit one per 10 ft."}
parking_per_unit: {value: 1.5, source: Z, assumption: "1.5 enclosed spaces for attached homes with two or fewer bedrooms; 2 for larger or detached homes. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.25, source: Z, assumption: "1 guest space per 4 homes."}

simplifications:
  - "Unit size limits (§30-9.3.c) aren't modeled."
