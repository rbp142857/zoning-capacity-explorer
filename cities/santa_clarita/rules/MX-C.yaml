# Santa Clarita MX-C. Every value cites the Santa Clarita Municipal Code, Title 17 (eCode360, read 2026-11-01).
zone: "MX-C"
name: "Mixed Use Corridor (MXC)"
family: commercial

sources:
  Z:
    section: "SCMC Ch. 17.35 (Mixed Use Zones)"
    url: https://ecode360.com/48595337
  U:
    section: "SCMC Ch. 17.42 (residential use types and parking)"
    url: https://ecode360.com/48595809

residential_allowed: {value: true, source: Z}
housing_types: {value: [mixed_use, multifamily], source: Z}
approval: {value: by_right, source: Z, assumption: "Chapter 17.35's table marks single-family, two-family and multifamily dwellings P."}
lot_area_per_unit_sqft: {value: 1452, source: Z, assumption: "43,560 sq ft per acre divided by the zone's density. The code counts gross acres; we use the lot."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 1452

setbacks:
  front_ft: {value: 5, source: Z}
  side_ft: {value: 0, source: Z}
  rear_ft: {value: 0, source: Z}

max_height_ft: {value: 50, source: Z}
max_stories: {value: 4, source: Z, assumption: "The code limits height to 50 ft without a CUP; we fit 4 stories."}
parking_per_unit: {value: 2, source: U, assumption: "2 enclosed spaces for 1 or 2 bedrooms. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.5, source: U, assumption: "1 guest space per 2 homes, for more than 3 homes."}
guest_parking_min_units: 4

simplifications:
  - "30 homes per acre, minimum 11. A minimum nonresidential FAR of 0.25 can apply; we count an all-residential building, which runs high."
  - "A 25 ft setback from neighboring residential zones and the road-type setbacks are simplified to 5 ft in front and none elsewhere."
