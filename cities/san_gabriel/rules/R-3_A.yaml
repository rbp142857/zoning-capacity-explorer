# San Gabriel R-3 A. Every value cites the San Gabriel Municipal Code, Chapter 153 (American Legal, read 2026-11-01).
zone: "R-3 A"
name: "Multiple-Family Residence (R-3); R-3 A in SCAG's table"
family: multifamily

sources:
  Z:
    section: "SGMC §§153.100 to 153.105"
    url: https://codelibrary.amlegal.com/codes/sangabriel/latest/sangabriel_ca/0-0-0-26341
  P:
    section: "SGMC §153.220 (Number of Parking Spaces Required)"
    url: https://codelibrary.amlegal.com/codes/sangabriel/latest/sangabriel_ca/0-0-0-26946
  H:
    section: "City of San Gabriel, R-3 Development Regulations (2014 handout)"
    url: https://www.sangabrielcity.com/DocumentCenter/View/3811/R-3-Development-Regulations-2014-Revised

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family, multifamily], source: Z}
lot_area_per_unit_sqft: {value: 1742, source: Z}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "§153.102: the minimum site is 5,000 sq ft; a smaller lot keeps one home (assumed)."
small_lot_units_below_sqft: 5000

setbacks:
  front_ft: {value: 21, source: Z, assumption: "15 ft plus 3 ft for each story above the first: 21 ft at three stories."}
  side_ft: {value: 15, source: Z, assumption: "15 ft for buildings over 28 ft, as a three-story building is."}
  rear_ft: {value: 16, source: Z, assumption: "10 ft plus 3 ft for each story above the first: 16 ft at three stories. More next to R-1, not modeled."}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 3, source: Z}
lot_coverage: {value: 0.60, source: H, assumption: "From the city handout (2014); we did not find it in the sections read."}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces in a garage per home. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.3333, source: P, assumption: "1 guest space per 3 homes."}
guest_parking_min_units: 2

simplifications:
  - "Multi-family recreational areas are not modeled, so these can run high."
  - "SCAG shows this as R-3 with a letter we can't find in §153.015. We read the letter as an overlay and use R-3's rules; it may add limits we don't model."
