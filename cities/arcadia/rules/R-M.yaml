# Arcadia R-M. Every value cites the Arcadia Development Code, Art. IX Ch. 1 (Municode, read 2026-11-01).
zone: "R-M"
name: "Residential Mountainous (R-M)"
family: single_family

sources:
  Z:
    section: "ADC §9102.01.030"
    url: https://library.municode.com/ca/arcadia/codes/code_of_ordinances?nodeId=ARTIXDIUSLA_CH1DECO_DIV2ZOALUSDEST_S9102.01REZO

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family], source: Z}
min_lot_area_sqft: {value: 15000, source: Z}
min_lot_width_ft: {value: 100, source: Z}
max_units_per_lot: {value: 1, source: Z, assumption: "1 unit per lot. State law (ADU, SB 9) is modeled separately."}

setbacks:
  front_ft: {value: 25, source: Z}
  side_ft: {value: {pct_of_width: 0.1, min_ft: 10, max_ft: 100}, source: Z, assumption: "10 ft or 10% of width, whichever is greater, first story."}
  rear_ft: {value: 25, source: Z}

max_height_ft:
  value:
    by: lot_width_ft
    bands:
      - {below: 75, value: 25}
      - {value: 30}
  source: Z
max_stories: {value: 2, source: Z}
lot_coverage: {value: 0.35, source: Z, assumption: "2-story homes; 45% for 1 story."}
max_floor_area:
  value:
    by: lot_area_sqft
    bands:
      - {below: 7501, share: 0.45}
      - {below: 10001, share: 0.40, plus_sqft: 375}
      - {below: 15001, share: 0.35, plus_sqft: 875}
      - {below: 20001, share: 0.25, plus_sqft: 2375}
      - {below: 30001, share: 0.20, plus_sqft: 3375}
      - {share: 0.15, plus_sqft: 4875}
  source: Z
  assumption: "North of Huntington Drive schedule; south of it allows more, and homeowner association areas differ. Not modeled, so this can run low."

simplifications:
  - "Parking wasn't read; the one-home limit binds either way."
