# Bell R3. Every value cites the Bell Municipal Code, Title 17 (eCode360, through Ord. 1297, read 2026-11-02).
zone: "R3"
name: "R-3 High Density Multiple-Family Residential"
family: multifamily

sources:
  Z:
    section: "BMC §§17.24.020 and 17.24.050"
    url: https://ecode360.com/44226085
  P:
    section: "BMC §17.76.020(7) (parking for dwelling units)"
    url: https://ecode360.com/44227184

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family, two_unit, multifamily], source: Z}
approval: {value: by_right, source: Z, assumption: "Multiple dwelling units are a principal use."}
min_lot_area_sqft: {value: 7200, source: Z, assumption: "Applies to lots created after 1989; most older lots are smaller and flagged."}
min_lot_width_ft: {value: 60, source: Z, assumption: "65 ft on corner lots."}
lot_area_per_unit_sqft: {value: 1452, source: Z}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 1452

setbacks:
  front_ft: {value: 15, source: Z, assumption: "15 ft, or the block's average if less. We use 15."}
  side_ft: {value: 5, source: Z}
  rear_ft: {value: 10, source: Z}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 3, source: Z}
lot_coverage: {value: 0.50, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces per home. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.33, source: P, assumption: "1 open space per 3 multifamily homes."}

simplifications:
  - "150 sq ft of private open space per home is not modeled, so these can run high."
