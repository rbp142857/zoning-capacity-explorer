# Bell R2. Every value cites the Bell Municipal Code, Title 17 (eCode360, through Ord. 1297, read 2026-11-02).
zone: "R2"
name: "R-2 Light Multiple-Family Residential"
family: multifamily

sources:
  Z:
    section: "BMC §§17.20.020 and 17.20.040"
    url: https://ecode360.com/44225983
  P:
    section: "BMC §17.76.020(7) (parking for dwelling units)"
    url: https://ecode360.com/44227184

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family, two_unit], source: Z}
min_lot_area_sqft: {value: 5000, source: Z}
min_lot_width_ft: {value: 50, source: Z}
max_units_per_lot: {value: 2, source: Z, assumption: "One two-family home or two single-family homes."}

setbacks:
  front_ft: {value: 25, source: Z, assumption: "25 ft, or the block's average if less. We use 25."}
  side_ft: {value: 5, source: Z}
  rear_ft: {value: 10, source: Z}

max_height_ft: {value: 30, source: Z}
max_stories: {value: 2, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces per home."}
