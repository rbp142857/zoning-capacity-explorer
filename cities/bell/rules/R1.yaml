# Bell R1. Every value cites the Bell Municipal Code, Title 17 (eCode360, through Ord. 1297, read 2026-11-02).
zone: "R1"
name: "R-1 Single-Family Residential"
family: single_family

sources:
  Z:
    section: "BMC §§17.16.020 and 17.16.040"
    url: https://ecode360.com/44225857

residential_allowed: {value: true, source: Z}
