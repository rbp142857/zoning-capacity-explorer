# Long Beach R-1-M. Every value cites the Long Beach Municipal Code, Title 21 (Municode, read 2026-11-01).
zone: "R-1-M"
name: "Residential (R-1-M)"
family: single_family

sources:
  Z:
    section: "LBMC Ch. 21.31, Tables 31-1, 31-2A and 31-2B"
    url: https://library.municode.com/ca/long_beach/codes/municipal_code?nodeId=TIT21ZO_CH21.31REDI
  P:
    section: "LBMC Ch. 21.41 (off-street parking)"
    url: https://library.municode.com/ca/long_beach/codes/municipal_code?nodeId=TIT21ZO_CH21.41OREPALORE

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family], source: Z}
approval: {value: by_right, source: Z, assumption: "Chapter 21.31's land use table marks the zone's home types Y, a permitted use."}
min_lot_area_sqft: {value: 3600, source: Z}
min_lot_width_ft: {value: 40, source: Z}
max_units_per_lot: {value: 1, source: Z, assumption: "One home per lot. State law (ADU, SB 9) is modeled separately."}

setbacks:
  front_ft: {value: 8, source: Z}
  side_ft: {value: 4, source: Z}
  rear_ft: {value: 8, source: Z}

max_height_ft: {value: 25, source: Z}
max_stories: {value: 2, source: Z}
max_far: {value: 0.67, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces for two or more bedrooms. None within ½ mile of a major transit stop (the AB 2097 path)."}

simplifications:
  - "Open space per home, second-story rear yards and Height Overlay (HL) reductions are not modeled."
