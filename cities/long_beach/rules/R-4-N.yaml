# Long Beach R-4-N. Every value cites the Long Beach Municipal Code, Title 21 (Municode, read 2026-11-01).
zone: "R-4-N"
name: "Residential (R-4-N)"
family: multifamily

sources:
  Z:
    section: "LBMC Ch. 21.31, Tables 31-1, 31-2A and 31-2B"
    url: https://library.municode.com/ca/long_beach/codes/municipal_code?nodeId=TIT21ZO_CH21.31REDI
  P:
    section: "LBMC Ch. 21.41 (off-street parking)"
    url: https://library.municode.com/ca/long_beach/codes/municipal_code?nodeId=TIT21ZO_CH21.41OREPALORE

residential_allowed: {value: true, source: Z}
housing_types: {value: [multifamily], source: Z}
approval: {value: by_right, source: Z, assumption: "Chapter 21.31's land use table marks the zone's home types Y, a permitted use."}
min_lot_area_sqft: {value: 18000, source: Z, assumption: "For new lots. Smaller existing lots get the density table."}
min_lot_width_ft: {value: 120, source: Z}
lot_area_per_unit_sqft:
  value:
    by: lot_area_sqft
    bands:
      - {below: 15001, value: 1500}
      - {below: 22501, value: 1200}
      - {value: 975}
  source: Z
  assumption: "The table sets density by both site area and width; we use area, which can run high on narrow lots."
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 3201

setbacks:
  front_ft: {value: 15, source: Z}
  side_ft: {value: {pct_of_width: 0.1, min_ft: 3, max_ft: 50}, source: Z, assumption: "10% of lot width in these zones where shown; note (q) wasn't read."}
  rear_ft: {value: 20, source: Z}

max_height_ft: {value: 38, source: Z}
max_stories: {value: 3, source: Z}
parking_per_unit: {value: 1.5, source: P, assumption: "1.5 spaces for a 1-bedroom home; 2 for larger, 2 in the Coastal Zone. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.25, source: P, assumption: "1 guest space per 4 homes; this table's notes on project size weren't read."}

simplifications:
  - "Open space per home, second-story rear yards and Height Overlay (HL) reductions are not modeled."
