# City configuration for Pasadena, CA.
# Everything city-specific that is NOT a zoning rule lives here: where the data
# comes from, which coordinate system to measure in, and how to read zone codes.
# Zoning rules themselves go in cities/pasadena/rules/ (milestone 3).

id: pasadena
name: Pasadena, California
state: CA

# EPSG:2229 = NAD83 / California State Plane Zone 5, measured in US survey feet.
# We do all area and distance math in this projected CRS, because lat/lon
# degrees are not a unit of length. See LEARNING.md -> "Coordinate systems".
analysis_crs: "EPSG:2229"

sources:
  parcels:
    kind: arcgis
    adapter: la_assessor
    url: https://public.gis.lacounty.gov/public/rest/services/LACounty_Cache/LACounty_Parcel/MapServer/0
    # TaxRateCity is the city the parcel is legally in. SitusCity is only the
    # mailing city: about 5,000 unincorporated parcels have "PASADENA CA"
    # addresses but follow LA County zoning, not Pasadena's.
    where: "TaxRateCity = 'PASADENA'"
    publisher: Los Angeles County Office of the Assessor
    license: Public record; published by LA County without an explicit open license. Attribution given. Owner names are not included in the source.
  zoning:
    kind: arcgis
    adapter: pasadena_zoning
    url: https://services2.arcgis.com/zNjnZafDYCAJAbN0/ArcGIS/rest/services/Zoning/FeatureServer/0
    where: "1=1"
    publisher: City of Pasadena Planning & Community Development
    license: Published by the City of Pasadena; no explicit open license. Attribution given.
  city_boundary:
    kind: arcgis
    url: https://services2.arcgis.com/zNjnZafDYCAJAbN0/ArcGIS/rest/services/City_Boundary/FeatureServer/0
    where: "1=1"
    publisher: City of Pasadena
    license: Published by the City of Pasadena; no explicit open license. Attribution given.
  specific_plans:
    # Boundaries of the specific plan areas. We use this layer (not just the
    # zone-code prefix) to decide whether a lot is in a specific plan, because
    # some plan areas use plain codes like "CL" or "RM-48" with no prefix.
    kind: arcgis
    url: https://services2.arcgis.com/zNjnZafDYCAJAbN0/ArcGIS/rest/services/SpecificPlanAreas/FeatureServer/0
    where: "1=1"
    publisher: City of Pasadena Planning & Community Development
    license: Published by the City of Pasadena; no explicit open license. Attribution given.
  districts:
    # Council districts are the "neighborhood" breakdown: Pasadena has no
    # official neighborhood map, and districts are stable, citable and known to
    # policymakers.
    kind: arcgis
    url: https://services2.arcgis.com/zNjnZafDYCAJAbN0/ArcGIS/rest/services/CouncilDistricts/FeatureServer/0
    where: "1=1"
    publisher: City of Pasadena
    license: Published by the City of Pasadena; no explicit open license. Attribution given.
  major_transit_stops:
    # SCAG's official inventory of "major transit stops" (Public Resources Code
    # 21064.3 as amended by AB 2553). This is the definition state law uses for
    # parking relief (AB 2097), so we use it instead of computing our own.
    kind: arcgis
    url: https://maps.scag.ca.gov/scaggis/rest/services/OpenData/Major_Transit_Stops_Plan_Year_2022/MapServer/0
    where: "1=1"
    publisher: Southern California Association of Governments (SCAG), Connect SoCal 2024, base year 2022
    license: Published by SCAG for planning purposes; no explicit open license. Attribution given.
  metro_rail_gtfs:
    kind: file
    url: https://gitlab.com/LACMTA/gtfs_rail/-/raw/master/gtfs_rail.zip
    publisher: Los Angeles County Metropolitan Transportation Authority
    license: LA Metro GTFS, published for public use under Metro's developer terms.
  # --- Validation sources (make validate) ---
  housing_element:
    # Adopted 2021-2029 Housing Element; Appendix C lists every site in the
    # sites inventory with its parcel number and the city's capacity estimate.
    # The city's server refuses automated downloads, so this one is manual.
    kind: manual
    filename: 2021-2029-Pasadena-Housing-Element.pdf
    url: https://www.cityofpasadena.net/planning/wp-content/uploads/sites/30/2021-2029-Pasadena-Housing-Element.pdf
    publisher: City of Pasadena (adopted July 18, 2022)
    license: Public government document.
    validation_only: true
  apr_table_a2:
    # Annual Progress Reports, Table A2: every home permitted or completed,
    # by year, parcel number and type (ADU, single-family, 2-4, 5+).
    kind: ckan
    url: https://data.ca.gov
    resource_id: fe505d9b-8c36-42ba-ba30-08bc4f34e022
    filters: {JURIS_NAME: PASADENA}
    publisher: California Department of Housing and Community Development (HCD)
    license: Published on data.ca.gov as open data.
    validation_only: true
  dof_e5:
    # Official housing-unit counts by city (2020 Census benchmark + estimates).
    # DOF's server also refuses automated downloads: manual.
    kind: manual
    filename: E-5_2026_InternetVersion.xlsx
    url: https://dof.ca.gov/media/docs/forecasting/Demographics/estimates/e-5-population-and-housing-estimates-for-cities-counties-and-the-state-2020-2026/E-5_2026_InternetVersion.xlsx
    publisher: California Department of Finance, Demographic Research Unit (E-5, May 2026)
    license: Public government data.
    validation_only: true

# Pasadena's zone codes combine an optional specific-plan prefix with a base
# district, e.g. "CD-MU-C" = Central District Specific Plan, MU-C district.
# We strip the prefix to get the base district. Whether a lot is in a specific
# plan at all comes from the specific_plans layer above (some plan areas use
# unprefixed codes). Specific-plan rules are simplified in the MVP and every
# such lot is flagged.
specific_plan_prefixes:
  CD: Central District Specific Plan
  EC: East Colorado Specific Plan
  ECSP: East Colorado Specific Plan
  EPSP: East Pasadena Specific Plan
  FGSP: Fair Oaks/Orange Grove Specific Plan
  LA: Lincoln Avenue Specific Plan
  LP: Lamanda Park Specific Plan
  SFO: South Fair Oaks Specific Plan
  WGSP: West Gateway Specific Plan  # not in the current specific_plans layer; verify in M3

# Assumptions the capacity engine needs that the zoning code does not give.
# Each one is a judgment call, explained here and in METHODOLOGY.md. Changing a
# number here changes every result, so keep them visible and dated.
assumptions:
  avg_unit_net_sqft: 850      # typical new apartment/condo; Table 4-6 parking for >650 sf units applies
  net_to_gross: 0.80          # share of building floor area that is inside units (rest: halls, stairs, walls)
  parking_stall_sqft: 300     # one surface stall (8.5 x 18 ft, §17.46.110) plus its share of the drive aisle
  parking_mode: surface       # by-right capacity assumes surface or at-grade parking, not garages under the building
  state_law_path: cities/_california/state_overrides.yaml

# "Likely to redevelop" screens (milestone 7). A lot is a redevelopment
# candidate only if it passes ALL of these. This is a screen, not a forecast:
# it says where replacing a building is plausible, not that it will happen.
# See METHODOLOGY.md, "Realistic vs. theoretical capacity".
redevelopment:
  as_of_year: 2026
  # Zoning (local rules or the scenario) must allow at least this many times
  # the homes already there; otherwise rebuilding gains too little to pay.
  min_capacity_multiple: 2.0
  # ...and rebuilding must add at least this many homes. Demolishing a
  # house to gain one or two homes rarely pays (land and the old building
  # are expensive), so those lots aren't counted, whether the extra homes
  # come from city rules or a reform scenario.
  min_net_new_units: 3
  # Buildings at least this old (built 1976 or earlier). Vacant lots pass.
  min_building_age_years: 50
  # Assessed building value below this share of land value. CAUTION: under
  # Prop 13 the assessor splits a sale price mostly into land, so this
  # screen passes 77% of lots and favors recently sold ones; it's kept as a
  # weak screen and the other three do most of the work.
  max_improvement_to_land_ratio: 1.0
  # Condos have many owners, so whole-building redevelopment is rare.
  exclude_condos: true
  # Demolition in landmark (historic) districts needs special review.
  exclude_overlay_prefixes: [LD-]
  # Small-scale infill on single-family lots (SB 9, ADUs, or a city
  # duplex/fourplex reform) has produced few homes wherever it's been allowed,
  # compared with how many lots became eligible. We don't count any of it as
  # "likely", whatever rule allows it, and report it separately instead.
  exclude_single_family_zones: true
