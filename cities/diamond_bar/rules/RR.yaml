# Diamond Bar RR. Every value cites the Diamond Bar City Code, Title 22 (Municode, read 2026-11-03).
zone: "RR"
name: "RR Rural Residential"
family: single_family

sources:
  Z:
    section: "DBCC §§22.08.030, 22.08.040 and 22.30"
    url: https://library.municode.com/ca/diamond_bar/codes/code_of_ordinances?nodeId=CICO_TIT22DECO_ARTIIZODIALLAUS_CH22.08REZODI

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family], source: Z}
approval: {value: by_right, source: Z, assumption: "The use table marks single-family dwellings P."}
max_units_per_lot: {value: 1, source: Z, assumption: "One single-family home per lot. State law (ADU, SB 9) is modeled separately."}
min_lot_area_sqft: {value: 43560, source: Z}

setbacks:
  front_ft: {value: 30, source: Z}
  side_ft: {value: 12.5, source: Z, assumption: "15 ft on one side and 10 on the other; we average them."}
  rear_ft: {value: 25, source: Z}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 2, source: Z, assumption: "The code limits height to 35 ft, not stories; we fit 2 (conservative)."}
lot_coverage: {value: 0.3, source: Z}
parking_per_unit: {value: 2, source: Z, assumption: "2 spaces in a fully enclosed garage. None within ½ mile of a major transit stop (the AB 2097 path)."}

simplifications:
  - "Hillside limits (Ch. 22.22) can lower density or change yards; we have no slope data, so hilly lots can run high."
