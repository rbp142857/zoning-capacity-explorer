# Avalon MD-R. Every value cites the Avalon Municipal Code, Title 9 (eCode360, code dated 2026-09-01, read 2026-11-02).
zone: "MD-R"
name: "Multiple Residential, Medium Density (MD)"
family: multifamily

sources:
  Z:
    section: "AMC §§9-5.302, 9-5.304 and 9-5.305"
    url: https://ecode360.com/35895184

residential_allowed: {value: true, source: Z, assumption: "Detached and two-family homes by right; attached and clustered homes need a conditional use permit."}
housing_types: {value: [single_family, two_unit, multifamily], source: Z}
min_lot_area_sqft: {value: 4400, source: Z}
min_lot_width_ft: {value: 50, source: Z}
lot_area_per_unit_sqft: {value: 2178, source: Z, assumption: "20 homes per acre: 43,560 divided by 20."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 2178

setbacks:
  front_ft: {value: 10, source: Z}
  side_ft: {value: 10, source: Z}
  rear_ft: {value: 10, source: Z}

max_height_ft: {value: 28, source: Z}
max_stories: {value: 2, source: Z}
lot_coverage: {value: 0.50, source: Z}
max_far: {value: 1.0, source: Z, assumption: "100% at two levels for lots of 14° or less; 70% on hillside lots."}
parking_per_unit: {value: 1, source: Z}

simplifications:
  - "We have no slope data, so the standards for lots of 14° or less are used; hillside lots allow 3 stories but less floor area (§9-5.305/405), so they can differ either way."
