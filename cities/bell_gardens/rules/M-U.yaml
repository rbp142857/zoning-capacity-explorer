# Bell Gardens M-U. Every value cites the Bell Gardens Municipal Code, Title 9 (eCode360, through 06-29-2026, read 2026-11-02).
zone: "M-U"
name: "Mixed Use Residential/Commercial (M-U)"
family: commercial

sources:
  Z:
    section: "BGMC §§9.12.020 and 9.12.040, Table 9.12B"
    url: https://ecode360.com/48053901
  P:
    section: "BGMC Ch. 9.38, required parking (Residential Uses)"
    url: https://ecode360.com/48055097

residential_allowed: {value: true, source: Z}
housing_types: {value: [mixed_use, multifamily], source: Z}
min_lot_area_sqft: {value: 15000, source: Z}
min_lot_width_ft: {value: 50, source: Z, assumption: "Plus 5 ft per 1,000 sq ft of lot, up to 100 ft; not modeled."}
lot_area_per_unit_sqft: {value: 1452, source: Z, assumption: "30 homes per acre: 43,560 divided by 30."}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "A lot too small for one home keeps one home (assumed)."
small_lot_units_below_sqft: 1452

setbacks:
  front_ft: {value: 15, source: Z, assumption: "15 ft for residential, 5 ft for commercial."}
  side_ft: {value: 5, source: Z, assumption: "5 ft for residential, none for commercial."}
  rear_ft: {value: 10, source: Z}

max_height_ft: {value: 60, source: Z}
max_stories: {value: 4, source: Z, assumption: "The table limits height to 60 ft, not stories; we fit 4 (conservative)."}
lot_coverage: {value: 0.90, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces per home. None within ½ mile of a major transit stop (the AB 2097 path)."}
guest_parking_per_unit: {value: 0.5, source: P, assumption: "1 visitor space per 2 homes at 5 or more homes."}
guest_parking_min_units: 5

simplifications:
  - "Commercial space and any FAR limit on homes aren't modeled; we count all floor area as homes up to the density, so these can run high."
