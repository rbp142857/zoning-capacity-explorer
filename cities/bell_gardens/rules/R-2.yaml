# Bell Gardens R-2. Every value cites the Bell Gardens Municipal Code, Title 9 (eCode360, through 06-29-2026, read 2026-11-02).
zone: "R-2"
name: "Medium Density Residential (R-2)"
family: multifamily

sources:
  Z:
    section: "BGMC §§9.10.020 to 9.10.040, Tables 9.10A and 9.10B"
    url: https://ecode360.com/48053893
  P:
    section: "BGMC Ch. 9.38, required parking (Residential Uses)"
    url: https://ecode360.com/48055097

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family, two_unit, multifamily], source: Z}
min_lot_area_sqft: {value: 5000, source: Z}
min_lot_width_ft: {value: 50, source: Z}
max_units_per_lot: {value: 3, source: Z}
lot_area_per_unit_sqft: {value: 2500, source: Z}
small_lot_units:
  value:
    by: lot_area_sqft
    bands:
      - {value: 1}
  source: Z
  assumption: "Under 5,000 sq ft, one home."
small_lot_units_below_sqft: 5000

setbacks:
  front_ft: {value: 20, source: Z}
  side_ft: {value: 5, source: Z}
  rear_ft: {value: 10, source: Z}

max_height_ft: {value: 35, source: Z}
max_stories: {value: 2, source: Z, assumption: "The table limits height to 35 ft, not stories, and sets second-story setbacks; we fit 2 (conservative)."}
lot_coverage: {value: 0.45, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces per home at four homes or fewer."}
