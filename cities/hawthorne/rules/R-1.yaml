# Hawthorne R-1. Every value cites the Hawthorne Municipal Code, Title 17 (eCode360, read 2026-11-01).
zone: "R-1"
name: "R-1 Zone"
family: single_family

sources:
  Z:
    section: "HMC Ch. 17.20a (R-1 Zone)"
    url: https://ecode360.com/42647598
  G:
    section: "HMC §§17.21.020 and 17.21.025"
    url: https://ecode360.com/42647933
  P:
    section: "HMC Ch. 17.10f (Parking)"
    url: https://ecode360.com/42649022

residential_allowed: {value: true, source: Z}
housing_types: {value: [single_family], source: Z}
approval: {value: by_right, source: Z, assumption: "The table of uses lists single-family detached dwellings with no use permit; it marks the uses that need one (CUP)."}
min_lot_area_sqft: {value: 5000, source: Z}
min_lot_width_ft: {value: 50, source: Z}
max_units_per_lot: {value: 1, source: Z, assumption: "One single-family detached home. State law (ADU, SB 9, Ch. 17.24f) is modeled separately."}

setbacks:
  front_ft: {value: 15, source: Z}
  side_ft: {value: {pct_of_width: 0.1, min_ft: 3.5, max_ft: 5}, source: Z, assumption: "10% of lot width, at most 5 ft and at least 3.5 ft."}
  rear_ft: {value: 5, source: Z}

max_height_ft: {value: 22, source: Z, assumption: "12 ft on lots under 40 ft average width and under 5,000 sq ft; not modeled, so those lots can run high."}
max_stories: {value: 2, source: G, assumption: "§17.21.025: buildings limited to 22 ft have at most two stories."}
lot_coverage: {value: 0.50, source: Z}
parking_per_unit: {value: 2, source: P, assumption: "2 spaces per home. None within ½ mile of a major transit stop (the AB 2097 path)."}
