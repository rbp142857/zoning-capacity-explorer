[project]
name = "zce"
version = "0.1.0"
description = "Zoning Capacity Explorer data pipeline and capacity engine"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyogrio>=0.13.0",
    "pypdf>=6.21.4",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["exercise: tests for a learning exercise; run with `make exercise`"]
# Exercise tests are skipped by default so `make test` stays green until you
# have written the exercise.
addopts = "-m 'not exercise'"
